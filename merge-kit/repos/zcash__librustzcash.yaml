repo: zcash/librustzcash
ai_policy:
  stance: "allowed, but a PR needs a prior issue that a maintainer has acknowledged; AI use must be disclosed"
  who_may_write_text: "AI may help; the contributor is the sole responsible author; agents must ask the human about prior maintainer discussion before drafting a PR"
  disclosure: "add `Co-Authored-By:` metadata naming the AI system to every AI-assisted commit; missing it is grounds for closing the PR; the same disclosure is asked for issues and comments"
  cla: "no CLA; contributor must agree they authored 100 percent of the content and may license it under the project licenses"
  source: "https://github.com/zcash/librustzcash/blob/main/AGENTS.md 'CONTRIBUTION GATE' and 'AI Disclosure'; CONTRIBUTING.md 'Legal Notice' (fetched 2026-11-28)"
ci:
  local: ["cargo test --workspace --all-features", "cargo fmt --check", "cargo clippy --workspace --all-targets"]
  notes: "CI, Audits and zizmor run on pull_request; commands above are the usual Rust set, not quoted from the repo"
  source: ".github/workflows/ci.yml, audits.yml, zizmor.yml (fetched 2026-11-28)"
pr:
  title_regex: null
  body:
    required: []
    forbidden: []
    disclosure: "disclose AI use in the PR text and with Co-Authored-By in the commits"
  body_template: |
    <Motivation, change, and the issue where a maintainer agreed to the work.>

    Issue: #<issue>

    AI use: <what the AI did; who reviewed>.
  source: "AGENTS.md 'Contribution Policy'; CONTRIBUTING.md 'Commit Messages'"
placement:
  rules: ["open an issue first and wait for a maintainer reply before any PR", "no trivial PRs (typos, link fixes, style) from unknown contributors", "changelog entry or change fragment in the same commit as the change", "full rustdoc on new public API", "failing test in a commit before the bug fix", "draft until CI passes, then Ready For Review", "clean rebased history; merge commits are used to merge"]
  source: "CONTRIBUTING.md 'Suggesting Enhancements', 'Branch History', 'Changelog Entries'; .changes/README.md"
review:
  style: "human maintainers; heavy workload; slow and variable (12 hours to 15 days on sampled merged PRs); maintainers often force-push to the branch"
  recurring: {}
  recurring_note: "no review has landed on our work here yet"
  source: "CONTRIBUTING.md 'I Have a Question'; sampled merged PRs librustzcash#3280, #3307, #3062"
max_open_prs:
  value: "no written cap; our default 2"
  source: "none stated in CONTRIBUTING.md or AGENTS.md"
ready_signal:
  how: "no reviewer is assigned automatically (no CODEOWNERS); mark the PR Ready For Review once CI passes and wait for a maintainer. An issue reply from a maintainer must exist before the PR"
  source: "CONTRIBUTING.md 'Branch History'; AGENTS.md gate"
lean: {src_dirs: [], source: "not a Lean repo"}
scope:
  allowed_paths: []
  max_topics: 1
  topic_depth: 2
